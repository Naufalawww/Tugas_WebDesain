<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        h1 {
            color: blue;
        }
        /* Gabungan dari style.css eksternal */
        .kotak {
            width: 300px;
            height: 100px;
            background-color: lightgreen;
            border: 2px solid black;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Ini adalah Heading 1</h1>
    <p style="color: red;">Ini adalah paragraf dengan Inline CSS.</p>
    <div class="kotak">Kotak dengan CSS Eksternal</div>
</body>
</html>
